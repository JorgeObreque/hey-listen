name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  S3_BUCKET: hey-listen-link-prod-748624205370
  CLOUDFRONT_DISTRIBUTION_ID: EF9UETA0ZN1J9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::748624205370:role/hey-listen-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload cached assets
        run: >-
          aws s3 sync dist "s3://${S3_BUCKET}"
          --delete
          --cache-control "public,max-age=604800"

      - name: Upload entry points without cache
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET}/index.html" --cache-control "no-cache,max-age=0,must-revalidate" --content-type "text/html; charset=utf-8"
          aws s3 cp dist/heylisten.js "s3://${S3_BUCKET}/heylisten.js" --cache-control "no-cache,max-age=0,must-revalidate" --content-type "text/javascript; charset=utf-8"
          aws s3 cp dist/heylisten.css "s3://${S3_BUCKET}/heylisten.css" --cache-control "no-cache,max-age=0,must-revalidate" --content-type "text/css; charset=utf-8"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
