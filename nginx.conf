server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /favicon.svg { access_log off; expires 7d; }
  location = /og.svg     { access_log off; expires 7d; }
  location ~* \.(?:css|js)$ { access_log off; expires -1; add_header Cache-Control "no-cache"; }
  location ~* \.(?:svg|woff2?)$ { access_log off; expires 7d; add_header Cache-Control "public, max-age=604800"; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
  gzip_min_length 256;
}
